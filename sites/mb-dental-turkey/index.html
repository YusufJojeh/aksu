<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf6"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Istanbul medical dental tourism, personalized cost estimates and visit planning."><meta property="og:type" content="website"><meta property="og:title" content="MB Dental Turkey | Dental tourism in Istanbul"><meta property="og:image" content="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&amp;fit=crop&amp;w=1100&amp;q=85"><link rel="canonical" href="https://mb-dental-turkey.vercel.app/en"><link rel="alternate" hreflang="en" href="https://mb-dental-turkey.vercel.app/en"><link rel="alternate" hreflang="ar" href="https://mb-dental-turkey.vercel.app/ar"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://images.unsplash.com"><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/landing.css"><title>MB Dental Turkey — Istanbul Dental Tourism</title></head><body><div id="app"><p>MB Dental Turkey</p></div><script>window.SITE={"name":"MB Dental Turkey","initials":"MB","tag":"SMILE BEYOND BORDERS","phone":"+90 555 066 9475","wa":"905550669475","address":"Başak Mh. Çamlıca Sk. No:6/I, Başakşehir, Istanbul","maps":"https://www.google.com/maps/search/?api=1&query=Basak+Mahallesi+Camlica+Sokak+No+6+Basaksehir+Istanbul","site":"mb","hero":"https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1100&q=85","heroAlt":"Warm editorial portrait representing a confident smile","secondImage":"https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=85","travelImage":"https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=1200&q=85","colors":{"ink":"#21433f","accent":"#cd5f50","bg":"#fffaf6","soft":"#fff0e7","pale":"#ffe1d3","dark":"#ac4539","light":"#ffd1b7"},"display":"DM Serif Display","services":[{"slug":"implants","photo":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1000&q=83","en":{"title":"Dental implants","short":"Explore implant-based options for replacing missing teeth and restoring function.","detail":"Dental implants are a treatment option for some patients with missing teeth. A dental implant is placed in the jaw to support a restoration such as a crown or bridge. Planning involves examination of oral health, bone conditions and treatment goals.","points":["An examination and imaging may be required to determine suitability.","Treatment phases and healing time vary between patients.","Risks, alternatives and aftercare should be discussed with your treating dentist."]},"ar":{"title":"زراعة الأسنان","short":"خيارات لتعويض الأسنان المفقودة واستعادة القدرة على المضغ والمظهر الطبيعي.","detail":"تُعد زراعة الأسنان خياراً مناسباً لبعض حالات فقدان الأسنان، وتعمل كقاعدة لدعم التاج أو الجسر. يحدد الطبيب الملاءمة بعد فحص صحة الفم والعظام ومناقشة الأهداف العلاجية.","points":["قد يتطلب التقييم فحصاً سريرياً وصوراً شعاعية.","تختلف مراحل العلاج ومدة الالتئام حسب الحالة.","يناقش الطبيب المخاطر والبدائل والعناية اللاحقة قبل الإجراء."]}},{"slug":"zirconium","photo":"https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=83","en":{"title":"Zirconium crowns","short":"Durable ceramic restorations designed around function, shape and aesthetics.","detail":"Zirconium crowns are tooth-colored dental restorations used where a crown is clinically indicated. Shape, bite, shade and existing tooth structure all inform the treatment plan.","points":["A crown is not the same as a veneer or an implant.","Tooth preparation requirements depend on the condition of the tooth.","Material selection and maintenance are discussed during assessment."]},"ar":{"title":"تيجان الزيركون","short":"ترميمات خزفية تجمع بين متطلبات الوظيفة وتناسق الشكل واللون.","detail":"تستخدم تيجان الزيركون لترميم الأسنان عندما تستدعي الحالة تركيب تاج. ويُخطط للتصميم وفق الإطباق ولون الأسنان وشكلها وحالة السن الأصلية.","points":["التاج يختلف عن العدسات السنية والزراعة.","تختلف متطلبات تحضير السن حسب الحالة.","تحدد ملاءمة المادة وخطة العناية خلال الاستشارة."]}},{"slug":"veneers","photo":"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?auto=format&fit=crop&w=1000&q=83","en":{"title":"E-max veneers","short":"Consider porcelain veneers when clinically appropriate for smile aesthetics.","detail":"E-max ceramic veneers can be considered for certain cosmetic concerns involving tooth color, form or symmetry. They are not appropriate for every mouth, and enamel preparation may be needed.","points":["The dentist evaluates enamel, bite and gum health first.","Changes to tooth structure may be irreversible.","Alternatives can include whitening, bonding or crowns depending on the case."]},"ar":{"title":"عدسات E-max","short":"عدسات خزفية لتحسين المظهر الجمالي للابتسامة في الحالات المناسبة.","detail":"يمكن استخدام عدسات E-max الخزفية لبعض الحالات التجميلية المرتبطة بلون الأسنان أو شكلها أو تناسقها. وهي ليست مناسبة للجميع وقد يتطلب الإجراء تحضيراً لسطح السن.","points":["يقيّم الطبيب المينا والإطباق وصحة اللثة أولاً.","بعض تغييرات بنية السن قد تكون غير قابلة للعكس.","قد توجد بدائل مثل التبييض أو الحشوات التجميلية أو التيجان."]}},{"slug":"whitening","photo":"https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=83","en":{"title":"Professional whitening","short":"Clinically guided options for addressing some types of tooth discoloration.","detail":"Professional whitening uses appropriate whitening products and supervision to help improve the appearance of certain tooth stains. The outcome varies based on the cause of discoloration, oral health, and existing restorations.","points":["A dental assessment helps identify the type of staining.","Crowns and veneers do not whiten like natural teeth.","Temporary sensitivity can occur and results vary."]},"ar":{"title":"تبييض الأسنان","short":"حلول بإشراف طبي للتعامل مع بعض أنواع تصبغات الأسنان.","detail":"يعتمد التبييض الاحترافي على مواد وإجراءات مناسبة بإشراف طبي للمساعدة على تحسين لون الأسنان. تختلف الاستجابة بحسب سبب التصبغات وحالة الفم والترميمات الموجودة.","points":["يساعد الفحص على تحديد طبيعة التصبغات.","لا تستجيب التيجان والعدسات للتبييض كالأسنان الطبيعية.","قد تحدث حساسية مؤقتة، وتختلف النتائج."]}},{"slug":"general","photo":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1000&q=83","en":{"title":"General dental care","short":"Routine examinations, restorations and oral-health care tailored to your needs.","detail":"A healthy smile starts with everyday oral care and clinical examination. General dentistry may involve preventive check-ups, cleaning, fillings, gum care and root-canal evaluation when needed.","points":["Routine assessment supports early identification of oral-health problems.","Treatment depends on a clinical examination.","Home care and follow-up remain essential after treatment."]},"ar":{"title":"العناية العامة بالأسنان","short":"فحوص وعلاجات أساسية للحفاظ على صحة الفم والأسنان.","detail":"تبدأ صحة الابتسامة بالعناية اليومية والفحوص الدورية. تشمل خدمات طب الأسنان العام حسب الحالة الفحص الوقائي والتنظيف والحشوات والعناية باللثة وتقييم الحاجة لعلاج العصب.","points":["تساعد الفحوص الدورية في اكتشاف المشكلات مبكراً.","تحدد خطة العلاج بعد الفحص السريري.","العناية المنزلية والمتابعة ضرورية للحفاظ على صحة الفم."]}}],"strings":{"en":{"home":"Home","treatments":"Treatments","journey":"Your journey","contact":"Contact","privacy":"Privacy","book":"Book a consultation","talkToUs":"Talk to our team","requestConsultation":"Request a consultation","exploreTreatments":"Explore treatments","ourExpertise":"Our expertise","learnMore":"Discover treatment","seeAll":"View all treatments","howItWorks":"How it works","patientJourney":"Patien RKEY · YOUR SMILE JOURNEY","heroTop":"A new smile.","heroAccent":"A new chapter.","heroEnd":"","heroLead":"Considered dental care, a welcoming Istanbul experience and a treatment journey shaped around your individual needs.","heroTrust1":"International patient support","heroTrust2":"Personalized planning","cardBig":"Feel at home","cardSmall":"Comfort and care throughout your visit.","seal":"SMILE / BEYOND / BORDERS","trustBar":["Dental implants","Zirconium & E-max","Istanbul patient journey","Multilingual assistance"],"servicesHeading":"Every smile has its own story.","servicesLead":"Explore the dental treatments presented by MB Dental Turkey and learn what to discuss with your clinical team.","featureAlt":"Dental-care environment","featureKicker":"MORE THAN A CLINIC VISIT","featureHeading":"Your Istanbul journey, thoughtfully considered.","featureLead":"Care extends beyond the dental chair. MB Dental's official patient journey includes guidance with travel and the visit experience.","features":["Patient-advisor guidance and individualized treatment planning","Hotel arrangements and private transfers described by the clinic; confirm what your package includes","Multilingual support for a clearer patient experience"],"stepsHeading":"Your journey, made simpler.","stepsLead":"A clear view of the conversation, planning and visit before deciding on treatment.","steps":[["Reach out","Share your goals and questions with the patient team."],["Review your case","Discuss an initial assessment and suggested next steps."],["Plan Istanbul","Confirm the clinical plan, travel and any included support."],["Visit & follow up","Meet the dental team and discuss treatment and aftercare."]],"editorialEyebrow":"SMILE BEYOND BORDERS","editorialHeading":"Good care travels beyond a single appointment.","editorialLead":"Start your conversation wherever you are. Treatment details, travel arrangements and fees depend on your individual plan.","faqLead":"Practical answers for patients exploring treatment in Istanbul.","faq":[["How do I start a consultation?","Send a brief message about the treatment you are interested in. The team can explain what information is needed for an initial review."],["Do you help international patients?","The clinic describes support with hotel arrangements, transfers and multilingual assistance. Confirm which services are available in your proposed plan."],["Which dental treatment should I choose?","A dentist needs to assess your oral health, anatomy and goals before recommending a treatment."],["How long should I stay in Istanbul?","Duration varies by treatment and clinical findings. Confirm timing before purchasing flights."]],"contactHeading":"Your smile journey starts here.","contactLead":"Tell the team what brings you to Istanbul. Your message opens WhatsApp with your chosen details.","formTitle":"Let's plan the conversation","namePlaceholder":"Your full name","countryPlaceholder":"Your country","messagePlaceholder":"Tell us a little about your goals","formConsent":"I agree to share these details with MB Dental Turkey over WhatsApp for a reply to my inquiry.","formNote":"You choose whether to send the prepared message in WhatsApp.","waHello":"Hello MB Dental Turkey team, I would like to ask about dental treatment in Istanbul.","medicalNote":"Treatment information is general and does not replace a dentist's examination. Eligibility, duration and results vary.","detailCta":"Let's find the appropriate next step.","detailCtaCopy":"Ask the team about suitability, alternatives, expected stages and individualized care.","journeyTitle":"Good planning makes the difference.","journeyIntro":"Explore the steps from your first conversation to your stay in Istanbul.","travelHeading":"Welcome to Istanbul.","travelCopy":"The clinic describes accommodation, transfer and reception services; check the details of any individual package before booking.","privacyLead":"How this site handles inquiry and browser information.","privacy":[["WhatsA ة.","servicesLead":"اكتشف علاجات الأسنان التي تعرضها MB Dental Turkey، وتعرّف على ما ينبغي مناقشته مع الفريق الطبي.","featureAlt":"بيئة طب أسنان","featureKicker":"أكثر من زيارة للعيادة","featureHeading":"رحلتك إلى إسطنبول بتخطيط مدروس.","featureLead":"تتجاوز العناية حدود كرسي العلاج؛ يوضح الموقع الرسمي خدمات تساعد المرضى في ترتيب الزيارة.","features":["مساعدة مستشار المرضى في التوجيه ووضع الخطة","ترتيبات الفندق والتنقل الخاص التي تعرضها العيادة، مع تأكيد تفاصيل الباقة قبل الحجز","مساعدة متعددة اللغات لتسهيل التواصل"],"stepsHeading":"رحلة أسهل، خطوة بخطوة.","stepsLead":"من التواصل الأول إلى زيارة العيادة والمتابعة، تعرف على الخطوات قبل اتخاذ القرار.","steps":[["تواصل معنا","شارك أهدافك وأسئلتك مع فريق المرضى."],["راجع حالتك","ناقش التقييم المبدئي والخطوات المقترحة."],["خطط لإسطنبول","تأكد من تفاصيل العلاج والسفر والخدمات المرافقة."],["الزيارة والمتابعة","قابل الفريق الطبي وناقش العلاج وخطة العناية بعده."]],"editorialEyebrow":"ابتسامة تتجاوز الحدود","editorialHeading":"العناية الجيدة تستمر لما بعد الموعد.","editorialLead":"ابدأ الحوار من أي مكان. تختلف تفاصيل العلاج والسفر والتكاليف بحسب الخطة المخصصة لك.","faqLead":"إجابات عملية للمرضى الراغبين بالعلاج في إسطنبول.","faq":[["كيف أبدأ الاستشارة؟","أرسل رسالة قصيرة تشرح العلاج الذي يهمك، وسيخبرك الفريق بالمعلومات المطلوبة للتقييم المبدئي."],["هل تساعدون المرضى القادمين من الخارج؟","تعرض العيادة خدمات الفنادق والتنقل والدعم اللغوي؛ تأكد من تفاصيل الخدمات المتاحة في خطتك."],["كيف أختار العلاج المناسب؟","يحتاج طبيب الأسنان لتقييم صحة الفم والأهداف قبل التوصية بعلاج محدد."],["كم يوم أحتاج في إسطنبول؟","تختلف المدة حسب نوع العلاج ونتائج الفحص، لذا تأكد من الجدول قبل شراء تذاكر السفر."]],"contactHeading":"رحلة ابتسامتك تبدأ هنا.","contactLead":"خبر الفريق بسبب زيارتك إلى إسطنبول، وسيُفتح واتساب برسالتك وتفاصيلك.","formTitle":"خلّينا نخطط للمحادثة","namePlaceholder":"اسمك الكامل","countryPlaceholder":"بلد الإقامة","messagePlaceholder":"خبرنا شو بتحب تغيّر بابتسامتك","formConsent":"أوافق على مشاركة معلوماتي مع MB Dental Turkey عبر واتساب للرد على استفساري.","formNote":"لن تُرسل رسالتك إلا بعد تأكيدها في واتساب.","waHello":"مرحباً فريق MB Dental Turkey، أود الاستفسار عن علاج الأسنان في إسطنبول.","medicalNote":"المعلومات عامة ولا تغني عن فحص طبيب الأسنان، وتختلف الملاءمة والمدة والنتائج حسب الحالة.","detailCta":"لنحدد الخطوة المناسبة لحالتك.","detailCtaCopy":"اسأل الفريق عن الخيارات والملاءمة والمراحل المتوقعة والعناية الخاصة بك.","journeyTitle":"التخطيط الجيد يصنع الفارق.","journeyIntro":"تعرف على رحلة التواصل الأولى وصولاً إلى إقامتك في إسطنبول.","travelHeading":"أهلاً بك في إسطنبول.","travelCopy":"تعرض العيادة خدمات إقامة وتنقل واستقبال؛ تأكد من تفاصيل الخدمات المضمنة في خطتك قبل الحجز.","privacyLead":"كيفية تعامل الموقع مع الاستفسارات والمعلومات المخزنة في المتصفح.","privacy":[["استفسارات واتساب","ينشئ النموذج رسالة واتساب جاهزة ولا يستخدم الموقع قاعدة بيانات مرضى لتخزين محتواها."],["بيانات الإحالة","قد تُحفظ وسوم مصدر الحملات مؤقتاً خلال الجلسة وتُضاف إلى الرسالة لمعرفة مصدر الاستفسار."],["اختيار ملفات الارتباط","يحفظ الموقع خيارك المتعلق بالخصوصية محلياً. لا تعمل أدوات إعلانية دون إعداد مستقل."],["المعلومات الصحية","تجنب تضمين سجلات طبية حساسة في الرسالة الأولى، واسأل الفريق عن وسيلة آمنة لمشاركتها."]],"cookiesText":"نستخدم التخزين المحلي الأساسي وبيانات إحالة الحملات الاختيارية، دون تشغيل ملفات إعلانات.","footerDesc":"استفسارات لعلاج الأسنان ومساعدة المرضى الدوليين في إسطنبول، تركيا.","footerRights":"استشر طبيب الأسنان قبل اتخاذ القرار العلاجي.","brandLead":"هوية دافئة تعبّر عن الجانب الإنساني في رحلة الابتسامة.","brandHeading":"Smile Beyond Borders","brandDescription":"الكورال والمشمشي والأخضر العميق لمظهر حيوي ودافئ ومدروس.","brandWordmark":"نظام الشعار","brandTypography":"الخطوط","brandArabicSample":"ابتسامة تتجاوز الحدود","brandInteraction":"الحركة والتفاعل","brandMotion":"حركات لطيفة وتفاصيل مريحة وتجربة جوال واضحة."}}};</script><script src="/landing.js" defer></script></body></html>
