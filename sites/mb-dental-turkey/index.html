لاءمة بعد فحص صحة الفم والعظام ومناقشة الأهداف العلاجية.","points":["قد يتطلب التقييم فحصاً سريرياً وصوراً شعاعية.","تختلف مراحل العلاج ومدة الالتئام حسب الحالة.","يناقش الطبيب المخاطر والبدائل والعناية اللاحقة قبل الإجراء."]}},{"slug":"zirconium","photo":"https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=83","en":{"title":"Zirconium crowns","short":"Durable ceramic restorations designed around function, shape and aesthetics.","detail":"Zirconium crowns are tooth-colored dental restorations used where a crown is clinically indicated. Shape, bite, shade and existing tooth structure all inform the treatment plan.","points":["A crown is not the same as a veneer or an implant.","Tooth preparation requirements depend on the condition of the tooth.","Material selection and maintenance are discussed during assessment."]},"ar":{"title":"تيجان الزيركون","short":"ترميمات خزفية تجمع بين متطلبات الوظيفة وتناسق الشكل واللون.","detail":"تستخدم تيجان الزيركون لترميم الأسنان عندما تستدعي الحالة تركيب تاج. ويُخطط للتصميم وفق الإطباق ولون الأسنان وشكلها وحالة السن الأصلية.","points":["التاج يختلف عن العدسات السنية والزراعة.","تختلف متطلبات تحضير السن حسب الحالة.","تحدد ملاءمة المادة وخطة العناية خلال الاستشارة."]}},{"slug":"veneers","photo":"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?auto=format&fit=crop&w=1000&q=83","en":{"title":"E-max veneers","short":"Consider porcelain veneers when clinically appropriate for smile aesthetics.","detail":"E-max ceramic veneers can be considered for certain cosmetic concerns involving tooth color, form or symmetry. They are not appropriate for every mouth, and enamel preparation may be needed.","points":["The dentist evaluates enamel, bite and gum health first.","Changes to tooth structure may be irreversible.","Alternatives can include whitening, bonding or crowns depending on the case."]},"ar":{"title":"عدسات E-max","short":"عدسات خزفية لتحسين المظهر الجمالي للابتسامة في الحالات المناسبة.","detail":"يمكن استخدام عدسات E-max الخزفية لبعض الحالات التجميلية المرتبطة بلون الأسنان أو شكلها أو تناسقها. وهي ليست مناسبة للجميع وقد يتطلب الإجراء تحضيراً لسطح السن.","points":["يقيّم الطبيب المينا والإطباق وصحة اللثة أولاً.","بعض تغييرات بنية السن قد تكون غير قابلة للعكس.","قد توجد بدائل مثل التبييض أو الحشوات التجميلية أو التيجان."]}},{"slug":"whitening","photo":"https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=83","en":{"title":"Professional whitening","short":"Clinically guided options for addressing some types of tooth discoloration.","detail":"Professional whitening uses appropriate whitening products and supervision to help improve the appearance of certain tooth stains. The outcome varies based on the cause of discoloration, oral health, and existing restorations.","points":["A dental assessment helps identify the type of staining.","Crowns and veneers do not whiten like natural teeth.","Temporary sensitivity can occur and results vary."]},"ar":{"title":"تبييض الأسنان","short":"حلول بإشراف طبي للتعامل مع بعض أنواع تصبغات الأسنان.","detail":"يعتمد التبييض الاحترافي على مواد وإجراءات مناسبة بإشراف طبي للمساعدة على تحسين لون الأسنان. تختلف الاستجابة بحسب سبب التصبغات وحالة الفم والترميمات الموجودة.","points":["يساعد الفحص على تحديد طبيعة التصبغات.","لا تستجيب التيجان والعدسات للتبييض كالأسنان الطبيعية.","قد تحدث حساسية مؤقتة، وتختلف النتائج."]}},{"slug":"general","photo":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1000&q=83","en":{"title":"General dental care","short":"Routine examinations, restorations and oral-health care tailored to your needs.","detail":"A healthy smile starts with everyday oral care and clinical examination. General dentistry may involve preventive check-ups, cleaning, fillings, gum care and root-canal evaluation when needed.","points":["Routine assessment supports early identification of oral-health problems.","Treatment depends on a clinical examination.","Home care and follow-up remain essential after treatment."]},"ar":{"title":"العناية العامة بالأسنان","short":"فحوص وعلاجات أساسية للحفاظ على صحة الفم والأسنان.","detail":"تبدأ صحة الابتسامة بالعناية اليومية والفحوص الدورية. تشمل خدمات طب الأسنان العام حسب الحالة الفحص الوقائي والتنظيف والحشوات والعناية باللثة وتقييم الحاجة لعلاج العصب.","points":["تساعد الفحوص الدورية في اكتشاف المشكلات مبكراً.","تحدد خطة العلاج بعد الفحص السريري.","العناية المنزلية والمتابعة ضرورية للحفاظ على صحة الفم."]}}],"strings":{"en":{"home":"Home","treatments":"Treatments","journey":"Your journey","contact":"Contact","privacy":"Privacy","book":"Book a consultation","talkToUs":"Talk to our team","requestConsultation":"Request a consultation","exploreTreatments":"Explore treatments","ourExpertise":"Our expertise","learnMore":"Discover treatment","seeAll":"View all treatments","howItWorks":"How it works","patientJourney":"Patient journey","exploreJourney":"See your journey","questions":"Questions, answered","letsTalk":"Your next step","startConversation":"Start a conversation","name":"Full name","phone":"Phone / WhatsApp","country":"Country","treatment":"Treatment of interest","chooseTreatment":"Select a treatment","message":"Your message","sendWhatsapp":"Continue on WhatsApp","planYourVisit":"Plan your visit","explore":"Explore","brandGuide":"Brand identity","aboutTreatment":"Understanding the treatment","whatToKnow":"What to expect","individualAssessment":"Personalized assessment","skip":"Skip to content","whatsapp":"WhatsApp","formError":"Please enter a valid name and phone and agree to be contacted.","cookiesTitle":"Your privacy matters","essentialOnly":"Essential only","accept":"Accept"},"ar":{"home":"الرئيسية","treatments":"العلاجات","journey":"رحلتك العلاجية","contact":"تواصل معنا","privacy":"الخصوصية","book":"احجز استشارة","talkToUs":"تحدث مع الفريق","requestConsultation":"اطلب استشارتك","exploreTreatments":"استكشف العلاجات","ourExpertise":"مجالات العناية","learnMore":"تفاصيل العل const site=window.SITE;

let page=current[0]||'home';
let S=site.strings[lang],T=site.text[lang];

function btn(text,url,cls=''){return '<a class="btn '+cls+'" href="'+esc(url)+'">'+esc(text)+' '+ic+'</a>'}
function header(){const nav=[['',S.home],['treatments',S.treatments],['journey',S.journey],['contact',S.contact]],menu=nav.map(([p,t])=>'<a href="'+href(p)+'" '+((page===p||(p===''&&page==='home'))?'aria-current="page"':'')+'>'+esc(t)+'</a>').join('');
let suffix=current.length?current.join('/'):'';
let language='<div class="lang" aria-label="Language"><a href="/en'+(suffix?'/'+suffix:'')+'" class="'+(lang==='en'?'active':'')+'">EN</a><a href="/ar'+(suffix?'/'+suffix:'')+'" class="'+(lang==='ar'?'active':'')+'">عربي</a></div>';
return '<div class="announcement"><div class="wrap"><span>✳ '+esc(T.announcement)+'</span><span>'+esc(T.locationLine)+'</span><a href="'+wa()+'" target="_blank" rel="noopener noreferrer">'+esc(S.talkToUs)+' ↗</a></div></div><header class="header"><div class="wrap nav">'+logo()+'<nav class="navlinks" aria-label="Main navigation">'+menu+'</nav><div class="navright">'+language+btn(S.book,href('contact'))+'<button type="button" class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" id="menuToggle">☰</button></div></div><nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation">'+menu+btn(S.book,href('contact'))+'</nav></header>'}
function footer(){return '<footer class="footer"><div class="wrap"><div class="footer-grid"><div>'+logo()+'<p class="footer-desc">'+esc(T.footerDesc)+'</p></div><div><h4>'+esc(S.explore)+'</h4><a href="'+href()+'">'+esc(S.home)+'</a><a href="'+href('treatments')+'">'+esc(S.treatments)+'</a><a href="'+href('journey')+'">'+esc(S.journey)+'</a></div><div><h4>'+esc(S.treatments)+'</h4>'+site.services.slice(0,4).map(x=>'<a href="'+href('treatments/'+x.slug)+'">'+esc(x[lang].title)+'</a>').join('')+'</div><div><h4>'+esc(S.contact)+'</h4><a href="tel:+'+site.wa+'">'+esc(site.phone)+'</a><a href="'+wa()+'" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a>'+(site.address?'<a href="'+site.maps+'" target="_blank" rel="noopener noreferrer">'+esc(site.address)+'</a>':'<span style="font-size:13px;color:#b6c4c5">'+esc(T.locationLine)+'</span>')+'</div></div><div class="footer-bottom"><span>© '+new Date().getFullYear()+' '+esc(site.name)+' · '+esc(T.footerRights)+'</span><span><a style="display:inline" href="'+href('privacy')+'">'+esc(S.privacy)+'</a> · <a style="display:inline" href="/brand">'+esc(S.brandGuide)+'</a></span></div></div></footer>'}
function serviceCard(x,i){return '<a class="service-card reveal" href="'+href('treatments/'+x.slug)+'"><div class="service-image">'+image(x.photo,x[lang].title)+'<span class="service-index">'+String(i+1).padStart(2,'0')+'</span></div><div class="service-info"><h3>'+esc(x[lang].title)+'</h3><p>'+esc(x[lang].short)+'</p><div class="service-foot"><span>'+esc(S.learnMore)+'</span><b>↗</b></div></div></a>'}
function heading(k,title,desc){return '<div class="section-heading reveal"><div class="eyebrow">'+esc(k)+'</div><h2 class="display">'+esc(title)+'</h2><p>'+esc(desc)+'</p></div>'}
function contactForm(){let options=site.services.map(x=>'<option value="'+esc(x[lang].title)+'">'+esc(x[lang].title)+'</option>').join('');
return '<form id="leadForm" class="contact-card" novalidate><div class="eyebrow">'+esc(S.requestConsultation)+'</div><h3 style="font-size:28px;margin-bottom:26px">'+esc(T.formTitle)+'</h3><div class="field-grid"><div class="field"><label for="fname">'+esc(S.name)+' *</label><input id="fname" name="name" autocomplete="name" maxlength="100" required placeholder="'+esc(T.namePlaceholder)+'"></div><div class="field"><label for="fphone">'+esc(S.phone)+' *</label><input id="fphone" name="phone" type="tel" autocomplete="tel" maxlength="30" required placeholder="+44 7xxx xxx xxx"></div></div><div class="field-grid"><div class="field"><label for="fcountry">'+esc(S.country)+'</label><input id="fcountry" name="country" autocomplete="country-name" maxlength="80" placeholder="'+esc(T.countryPlaceholder)+'"></div><div class="field"><label for="ftreatment">'+esc(S.treatment)+'</label><select id="ftreatment" name="treatment"><option value="">'+esc(S.chooseTreatment)+'</option>'+options+'</select></div></div><div class="field"><label for="fmessage">'+esc(S.message)+'</label><textarea id="fmessage" name="message" maxlength="800" placeholder="'+esc(T.messagePlaceholder)+'"></textarea></div><label class="consent-row"><input required type="checkbox" id="fconsent"><span>'+esc(T.formConsent)+'</span></label><button type="submit" class="btn" style="width:100%">'+esc(S.sendWhatsapp)+' '+ic+'</button><p id="formError" role="alert" style="font-size:12px;color:#bf3434;margin:11px 0 0;display:none"></p><p style="font-size:11px;color:var(--muted);margin:13px 0 0">'+esc(T.formNote)+'</p></form>'}
function home(){const steps=T.steps.map((x,i)=>'<div class="journey-card reveal"><div class="step-num">0'+(i+1)+'</div><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('');
return '<main id="main"><section class="hero"><div class="wrap hero-grid"><div class="reveal"><div class="kicker">'+esc(T.kicker)+'</div><h1 class="display">'+esc(T.heroTop)+' <em>'+esc(T.heroAccent)+'</em> '+esc(T.heroEnd)+'</h1><p>'+esc(T.heroLead)+'</p><div class="hero-actions">'+btn(S.requestConsultation,href('contact'))+btn(S.exploreTreatments,href('treatments'),'ghost')+'</div><div class="microcopy"><span><b>✳</b>'+esc(T.heroTrust1)+'</span><span><b>✳</b>'+esc(T.heroTrust2)+'</span></div></div><div class="hero-visual reveal">'+image(site.hero,site.heroAlt,false)+'<div class="float-card"><span class="seal">✦</span><span><strong>'+esc(T.cardBig)+'</strong>'+esc(T.cardSmall)+'</span></div><div class="curve-stamp">'+esc(T.seal)+'</div></div></div></section><div class="numberline"><div class="wrap">'+T.trustBar.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div><section id="services" class="section soft-section"><div class="wrap"><div class="section-top">'+heading(S.ourExpertise,T.servicesHeading,T.servicesLead)+'<a class="text-link" href="'+href('treatments')+'">'+esc(S.seeAll)+' ↗</a></div><div class="services-grid">'+site.services.map(serviceCard).join('')+'</div></div></section><section class="section"><div class="wrap feature-grid"><div class="reveal">'+image(site.secondImage,T.featureAlt)+'</div><div>'+heading(T.featureKicker,T.featureHeading,T.featureLead)+'<ul class="check-list">'+T.features.map(x=>'<li><i>✓</i>'+esc(x)+'</li>').join('')+'</ul>'+btn(S.howItWorks,href('journey'),'ghost')+'</div></div></section><section class="section soft-section"><div class="wrap">'+heading(S.patientJourney,T.stepsHeading,T.stepsLead)+'<div class="journey-grid">'+steps+'</div><div style="margin-top:35px">'+btn(S.exploreJourney,href('journey'),'ghost')+'</div></div></section>'+editorial()+'<section class="section"><div class="wrap faq-layout"><div>'+heading('FAQ',S.questions,T.faqLead)+'</div><div class="faq-list">'+faqs()+'</div></div></section><section class="section soft-section" id="consultation"><div class="wrap form-layout"><div>'+heading(S.letsTalk,T.contactHeading,T.contactLead)+contactPoints()+'</div>'+contactForm()+'</div></section></main>'}
function contactPoints(){return '<div class="contact-points"><div>◉ &nbsp;<strong>'+esc(T.locationLine)+'</strong></div><div>◉ &nbsp;<a href="tel:+'+site.wa+'"><strong>'+esc(site.phone)+'</strong></a></div><div>◉ &nbsp;<a href="'+wa()+'" target="_blank" rel="noopener noreferrer"><strong>WhatsApp ↗</strong></a></div>'+(site.address?'<div>◉ &nbsp;<a href="'+site.maps+'" target="_blank" rel="noopener noreferrer">'+esc(site.address)+' ↗</a></div>':'')+'</div>'}
function faqs(){return T.faq.map(x=>'<details class="faq"><summary>'+esc(x[0])+'</summary><p>'+esc(x[1])+'</p></details>').join('')}
function editorial(){return '<section class="editorial"><div class="wrap reveal"><div class="eyebrow">'+esc(T.editorialEyebrow)+'</div><h2 class="display">'+esc(T.editorialHeading)+'</h2><p>'+esc(T.editorialLead)+'</p>'+btn(S.startConversation,href('contact'))+'</div></section>'}
function pageHero(k,t,d){return '<section class="page-hero"><div class="wrap reveal"><div class="breadcrumbs"><a href="'+href()+'">'+esc(S.home)+'</a> / '+esc(k)+'</div><div class="kicker">'+esc(k)+'</div><h1 class="display">'+esc(t)+'</h1><p>'+esc(d)+'</p></div></section>'}
function servicesPage(){return '<main id="main">'+pageHero(S.treatments,T.servicesHeading,T.servicesLead)+'<section class="section"><div class="wrap"><div class="services-grid">'+site.services.map(serviceCard).join('')+'</div></div></section>'+editorial()+'</main>'}
function serviceDetail(x){let d=x[lang];return '<main id="main">'+pageHero(S.treatments,d.title,d.short)+'<section class="section"><div class="wrap detail-grid"><div><div class="reveal">'+image(x.photo,d.title)+'</div><article class="detail-body"><h2>'+esc(S.aboutTreatment)+'</h2><p>'+esc(d.detail)+'</p><h2>'+esc(S.whatToKnow)+'</h2><ul>'+d.points.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><p>'+esc(T.medicalNote)+'</p></article></div><aside class="detail-aside reveal"><span class="mini-tag">'+esc(S.individualAssessment)+'</span><h3>'+esc(T.detailCta)+'</h3><p>'+esc(T.detailCtaCopy)+'</p>'+btn(S.requestConsultation,href('contact'))+'<p style="font-size:11px;margin:18px 0 0">'+esc(T.medicalNote)+'</p></aside></div></section>'+editorial()+'</main>'}
function journey(){return '<main id="main">'+pageHero(S.journey,T.stepsHeading,T.stepsLead)+'<section class="section"><div class="wrap">'+heading(S.patientJourney,T.journeyTitle,T.journeyIntro)+'<div class="journey-grid">'+T.steps.map((x,i)=>'<div class="journey-card"><div class="step-num">0'+(i+1)+'</div><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('')+'</div></div></section><section class="section soft-section"><div class="wrap feature-grid"><div>'+heading(S.planYourVisit,T.travelHeading,T.travelCopy)+'<ul class="check-list">'+T.features.map(x=>'<li><i>✓</i>'+esc(x)+'</li>').join('')+'</ul>'+btn(S.talkToUs,href('contact'))+'</div><div>'+image(site.travelImage,T.travelHeading)+'</div></div></section></main>'}
function contact(){return '<main id="main">'+pageHero(S.contact,T.contactHeading,T.contactLead)+'<section class="section soft-section"><div class="wrap form-layout"><div>'+heading(S.letsTalk,T.formTitle,T.contactLead)+contactPoints()+'</div>'+contactForm()+'</div></section></main>'}
function privacy(){return '<main id="main">'+pageHero(S.privacy,S.privacy,T.privacyLead)+'<section class="section"><div class="wrap detail-body" style="max-width:820px">'+T.privacy.map(x=>'<h2>'+esc(x[0])+'</h2><p>'+esc(x[1])+'</p>').join('')+'<a href="'+href('contact')+'" class="text-link">'+esc(S.contact)+' ↗</a></div></section></main>'}
function brand(){return '<main id="main" class="brand-page">'+pageHero(S.brandGuide,site.name,T.brandLead)+'<section class="section"><div class="wrap">'+heading(S.brandGuide,T.brandHeading,T.brandDescription)+'<div class="swatches">'+[['Ink',site.colors.ink],['Accent',site.colors.accent],['Canvas',site.colors.bg],['Soft',site.colors.soft]].map(x=>'<div class="swatch" style="background:'+x[1]+';color:'+((x[0]==='Canvas'||x[0]==='Soft')?'#172b35':'white')+'">'+x[0]+'<br>'+x[1]+'</div>').join('')+'</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:35px"><div class="brand-spec">'+logo()+'<h3 style="margin-top:40px">'+esc(T.brandWordmark)+'</h3><p>'+esc(site.tag)+'</p></div><div class="brand-spec"><h3>'+esc(T.brandTypography)+'</h3><p style="font-size:26px;font-family:var(--display)">'+esc(T.brandHeading)+'</p><p style="font-family:Cairo">'+esc(T.brandArabicSample)+'</p></div><div class="brand-spec"><h3>'+esc(T.brandInteraction)+'</h3>'+btn(S.requestConsultation,href('contact'))+'<p style="font-size:13px;color:var(--muted);margin-top:20px">'+esc(T.brandMotion)+'</p></div></div></div></section></main>'}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=lang==='ar'?'rtl':'ltr';document.title=(page==='home'?site.name:page==='treatments'?(current[1]?site.services.find(x=>x.slug===current[1])?.[lang].title:S.treatments):page==='brand'?S.brandGuide:(S[page]||site.name))+' | '+site.name;
let body=page==='home'?home():page==='treatments'?(current[1]?serviceDetail(site.services.find(x=>x.slug===current[1])||site.services[0]):servicesPage()):page==='journey'?journey():page==='contact'?contact():page==='privacy'?privacy():page==='brand'?brand():home();
document.getElementById('app').innerHTML='<a class="skip" href="#main">'+esc(S.skip)+'</a>'+header()+body+footer()+'<div class="mobile-cta">'+btn(S.whatsapp,wa())+btn(S.book,href('contact'),'dark')+'</div><div id="cookieSlot"></div>';
document.querySelector('#menuToggle')?.addEventListener('click',e=>{let el=document.querySelector('#mobileNav');let v=el.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(v))});
document.querySelector('#leadForm')?.addEventListener('submit',function(e){e.preventDefault();let fd=new FormData(this),name=String(fd.get('name')||'').trim(),phone=String(fd.get('phone')||'').trim();let error=document.getElementById('formError');if(name.length<2||phone.replace(/\D/g,'').length<7||!document.getElementById('fconsent').checked){error.textContent=S.formError;error.style.display='block';return}error.style.display='none';let attrs=JSON.parse(sessionStorage.getItem('ad_params')||'{}');let msg=[T.waHello,S.name+': '+name,S.phone+': '+phone,S.country+': '+(fd.get('country')||'—'),S.treatment+': '+(fd.get('treatment')||'—'),S.message+': '+(fd.get('message')||'—'),...Object.entries(attrs).map(([k,v])=>k+': '+v)].join('\n');window.open(wa(msg),'_blank','noopener,noreferrer')});
try{let q=new URLSearchParams(location.search),attrs=JSON.parse(sessionStorage.getItem('ad_params')||'{}');['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid'].forEach(k=>{let v=q.get(k);if(v)attrs[k]=v.slice(0,120)});sessionStorage.setItem('ad_params',JSON.stringify(attrs))}catch(e){}
if(!localStorage.getItem('cookieChoice')){document.getElementById('cookieSlot').innerHTML='<div class="cookie-banner"><strong>'+esc(S.cookiesTitle)+'</strong><p>'+esc(T.cookiesText)+'</p><div class="cookie-actions"><button class="btn ghost" id="rejectCookies">'+esc(S.essentialOnly)+'</button><button class="btn" id="acceptCookies">'+esc(S.accept)+'</button></div></div>';['rejectCookies','acceptCookies'].forEach(id=>document.getElementById(id).onclick=()=>{localStorage.setItem('cookieChoice',id==='acceptCookies'?'accepted':'essential');document.getElementById('cookieSlot').innerHTML=''})}
if('IntersectionObserver' in window){let observer=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){x.target.classList.add('show');observer.unobserve(x.target)}}),{threshold:.07});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('show'));
}
render();
</script></body></html>
