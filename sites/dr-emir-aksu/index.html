<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fdfefe"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Istanbul medical dental tourism, personalized cost estimates and visit planning."><meta property="og:type" content="website"><meta property="og:title" content="Dr. Emir Aksu | Dental tourism in Istanbul"><meta property="og:image" content="https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&amp;fit=crop&amp;w=1100&amp;q=85"><link rel="canonical" href="https://dr-emir-aksu.vercel.app/en"><link rel="alternate" hreflang="en" href="https://dr-emir-aksu.vercel.app/en"><link rel="alternate" hreflang="ar" href="https://dr-emir-aksu.vercel.app/ar"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://images.unsplash.com"><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/landing.css"><title>Dr. Emir Aksu — Istanbul Dental Tourism</title></head><body><div id="app"><p>Dr. Emir Aksu</p></div><script>window.SITE={"name":"Dr. Emir Aksu","initials":"EA","tag":"SMILE STUDIO · ISTANBUL","phone":"+90 506 631 6160","wa":"905066316160","address":"","maps":"","site":"aksu","hero":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1100&q=85","heroAlt":"Dental consultation and smile care","secondImage":"https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=85","travelImage":"https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=1200&q=85","colors":{"ink":"#102653","accent":"#315bfa","bg":"#fdfefe","soft":"#f0f5ff","pale":"#dfeaff","dark":"#1a43d8","light":"#aebfff"},"display":"Manrope","services":[{"slug":"implants","photo":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1000&q=83","en":{"title":"Dental implants","short":"Explore implant-based options for replacing missing teeth and restoring function.","detail":"Dental implants are a treatment option for some patients with missing teeth. A dental implant is placed in the jaw to support a restoration such as a crown or bridge. Planning involves examination of oral health, bone conditions and treatment goals.","points":["An examination and imaging may be required to determine suitability.","Treatment phases and healing time vary between patients.","Risks, alternatives and aftercare should be discussed with your treating dentist."]},"ar":{"title":"زراعة الأسنان","short":"خيارات لتعويض الأسنان المفقودة واستعادة القدرة على المضغ والمظهر الطبيعي.","detail":"تُعد زراعة الأسنان خياراً مناسباً لبعض حالات فقدان الأسنان، وتعمل كقاعدة لدعم التاج أو الجسر. يحدد الطبيب الملاءمة بعد فحص صحة الفم والعظام ومناقشة الأهداف العلاجية.","points":["قد يتطلب التقييم فحصاً سريرياً وصوراً شعاعية.","تختلف مراحل العلاج ومدة الالتئام حسب الحالة.","يناقش الطبيب المخاطر والبدائل والعناية اللاحقة قبل الإجراء."]}},{"slug":"zirconium","photo":"https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=83","en":{"title":"Zirconium crowns","short":"Durable ceramic restorations designed around function, shape and aesthetics.","detail":"Zirconium crowns are tooth-colored dental restorations used where a crown is clinically indicated. Shape, bite, shade and existing tooth structure all inform the treatment plan.","points":["A crown is not the same as a veneer or an implant.","Tooth preparation requirements depend on the condition of the tooth.","Material selection and maintenance are discussed during assessment."]},"ar":{"title":"تيجان الزيركون","short":"ترميمات خزفية تجمع بين متطلبات الوظيفة وتناسق الشكل واللون.","detail":"تستخدم تيجان الزيركون لترميم الأسنان عندما تستدعي الحالة تركيب تاج. ويُخطط للتصميم وفق الإطباق ولون الأسنان وشكلها وحالة السن الأصلية.","points":["التاج يختلف عن العدسات السنية والزراعة.","تختلف متطلبات تحضير السن حسب الحالة.","تحدد ملاءمة المادة وخطة العناية خلال الاستشارة."]}},{"slug":"veneers","photo":"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?auto=format&fit=crop&w=1000&q=83","en":{"title":"E-max veneers","short":"Consider porcelain veneers when clinically appropriate for smile aesthetics.","detail":"E-max ceramic veneers can be considered for certain cosmetic concerns involving tooth color, form or symmetry. They are not appropriate for every mouth, and enamel preparation may be needed.","points":["The dentist evaluates enamel, bite and gum health first.","Changes to tooth structure may be irreversible.","Alternatives can include whitening, bonding or crowns depending on the case."]},"ar":{"title":"عدسات E-max","short":"عدسات خزفية لتحسين المظهر الجمالي للابتسامة في الحالات المناسبة.","detail":"يمكن استخدام عدسات E-max الخزفية لبعض الحالات التجميلية المرتبطة بلون الأسنان أو شكلها أو تناسقها. وهي ليست مناسبة للجميع وقد يتطلب الإجراء تحضيراً لسطح السن.","points":["يقيّم الطبيب المينا والإطباق وصحة اللثة أولاً.","بعض تغييرات بنية السن قد تكون غير قابلة للعكس.","قد توجد بدائل مثل التبييض أو الحشوات التجميلية أو التيجان."]}},{"slug":"whitening","photo":"https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=83","en":{"title":"Professional whitening","short":"Clinically guided options for addressing some types of tooth discoloration.","detail":"Professional whitening uses appropriate whitening products and supervision to help improve the appearance of certain tooth stains. The outcome varies based on the cause of discoloration, oral health, and existing restorations.","points":["A dental assessment helps identify the type of staining.","Crowns and veneers do not whiten like natural teeth.","Temporary sensitivity can occur and results vary."]},"ar":{"title":"تبييض الأسنان","short":"حلول بإشراف طبي للتعامل مع بعض أنواع تصبغات الأسنان.","detail":"يعتمد التبييض الاحترافي على مواد وإجراءات مناسبة بإشراف طبي للمساعدة على تحسين لون الأسنان. تختلف الاستجابة بحسب سبب التصبغات وحالة الفم والترميمات الموجودة.","points":["يساعد الفحص على تحديد طبيعة التصبغات.","لا تستجيب التيجان والعدسات للتبييض كالأسنان الطبيعية.","قد تحدث حساسية مؤقتة، وتختلف النتائج."]}},{"slug":"general","photo":"https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1000&q=83","en":{"title":"General dental care","short":"Routine examinations, restorations and oral-health care tailored to your needs.","detail":"A healthy smile starts with everyday oral care and clinical examination. General dentistry may involve preventive check-ups, cleaning, fillings, gum care and root-canal evaluation when needed.","points":["Routine assessment supports early identification of oral-health problems.","Treatment depends on a clinical examination.","Home care and follow-up remain essential after treatment."]},"ar":{"title":"العناية العامة بالأسنان","short":"فحوص وعلاجات أساسية للحفاظ على صحة الفم والأسنان.","detail":"تبدأ صحة الابتسامة بالعناية اليومية والفحوص الدورية. تشمل خدمات طب الأسنان العام حسب الحالة الفحص الوقائي والتنظيف والحشوات والعناية باللثة وتقييم الحاجة لعلاج العصب.","points":["تساعد الفحوص الدورية في اكتشاف المشكلات مبكراً.","تحدد خطة العلاج بعد الفحص السريري.","العناية المنزلية والمتابعة ضرورية للحفاظ على صحة الفم."]}}],"strings":{"en":{"home":"Home","treatments":"Treatments","journey":"Your journey","contact":"Contact","privacy":"Privacy","book":"Book a consultation","talkToUs":"Talk to our team","requestConsultation":"Request a consultation","exploreTreatments":"Explore treatments","ourExpertise":"Our expertise","learnMore":"Discover treatment","seeAll":"View all treatments","howItWorks":"How it works","patientJourney":"Patient journey","exploreJourney":"See your journey","questions":"Questions, answered","letsTalk":"Your next step","startConversation":"Start a conversation","name":"Full name","phone":"Phone / WhatsApp","country":"Country","treatment":"Treatment of interest","chooseTreatment":"Select a treatment","message":"Your message","sendWhatsapp":"Continue on WhatsApp","planYourVisit":"Plan your visit","explore":"Explore","brandGuide":"Brand identity","aboutTreatment":"Understanding the treatment","whatToKnow":"What to expect","individualAssessment":"Personalized assessment","skip":"Skip to content","whatsapp":"WhatsApp","formError":"Please enter a valid name and phone and agree to be contacted.","cookiesTitle":"Your privacy matters","essentialOnly":"Essential only","accept":"Accept"},"ar":{"home":"الرئيسية","treatments":"العلاجات","journey":"رحلتك العلاجية","contact":"تواصل معنا","privacy":"الخصوصية","book":"احجز استشارة","talkToUs":"تحدث مع الفريق","requestConsultation":"اطلب استشارتك","exploreTreatments":"استكشف العلاجات","ourExpertise":"مجالات العناية","learnMore":"تفاصيل العلاج","seeAll":"عرض جميع العلاجات","howItWorks":"كيف تتم الرحلة","patientJourney":"رحلة المريض","exploreJourney":"اكتشف رحلتك","questions":"أسئلة شائعة","letsTalk":"خطوتك القادمة","startConversation":"ابدأ المحادثة","name":"الاسم الكامل","phone":"رقم الهاتف / واتساب","country":"الدولة","treatment":"العلاج المطلوب","chooseTreatment":"اختر العلاج","message":"رسالتك","sendWhatsapp":"المتابعة عبر واتساب","planYourVisit":"خطط لزيارتك","explore":"استكشف","brandGuide":"دليل الهوية","aboutTreatment":"معلومات عن العلاج","whatToKnow":"ماذا تتوقع؟","individualAssessment":"تقييم حسب الحالة","skip":"انتقل للمحتوى","whatsapp":"واتساب","formError":"يرجى إدخال اسم ورقم هاتف صالحين والموافقة على التواصل.","cookiesTitle":"خصوصيتك مهمة","essentialOnly":"الضروري فقط","accept":"موافق"}},"text":{"en":{"announcement":"PERSONALIZED SMILE CARE IN ISTANBUL","locationLine":"Istanbul, Türkiye","kicker":"DR. EMIR AKSU · DENTAL CARE","heroTop":"The confidence to","heroAccent":"smile","heroEnd":"your way.","heroLead":"Thoughtful dentistry, clear treatment conversations and a more personal experience from your first message to your follow-up.","heroTrust1":"Care built around you","heroTrust2":"International patient guidance","cardBig":"Smile with clarity","cardSmall":"Your treatment starts with listening.","seal":"DESIGNED / FOR YOU / ✳","trustBar":["Cosmetic dentistry","Restorative solutions","Personalized consultation","Patient-first experience"],"servicesHeading":"Precision meets a personal touch.","servicesLead":"Explore approaches to smile design and dental health, with every recommendation guided by an individual clinical assessment.","featureAlt":"Modern dental care setting","featureKicker":"CARE BEYOND THE PROCEDURE","featureHeading":"Your questions deserve thoughtful answers.","featureLead":"A good treatment journey is built on understanding your options—not rushing into decisions.","features":["Clear communication about potential treatment options and trade-offs","Support with planning a visit to Istanbul, depending on the chosen treatment","Guidance before treatment and aftercare conversations"],"stepsHeading":"A simpler path to your next smile.","stepsLead":"From initial questions to follow-up, know what happens at each stage.","steps":[["Connect","Tell the team what you would like to improve and share your concerns."],["Understand","Discuss possible options, timing and what an assessment involves."],["Plan","Review your clinical plan and practical travel details."],["Follow through","Receive treatment as planned and discuss ongoing care."]],"editorialEyebrow":"A MORE PERSONAL EXPERIENCE","editorialHeading":"Your smile is personal. Your treatment should be too.","editorialLead":"Start with a conversation about your goals. Treatment recommendations, costs and timing follow clinical assessment.","faqLead":"Straightforward answers to help you make informed choices.","faq":[["Which treatment is right for me?","The best option depends on an examination of your teeth, gums, bite and goals. The team can help you understand next steps."],["How many visits will I need?","Visit count depends on the selected treatment and your clinical needs. Implants may require separate stages."],["Can I plan treatment while visiting Istanbul?","You can contact the team to discuss scheduling and whether your treatment plan can fit your travel dates."],["Will the results look natural?","Treatment planning considers the appearance and function of your smile, but outcomes vary and cannot be guaranteed."]],"contactHeading":"Let's talk about your smile.","contactLead":"Share a few details and continue the conversation directly with the team on WhatsApp.","formTitle":"Tell us about your smile goals","namePlaceholder":"Your name","countryPlaceholder":"Where are you travelling from?","messagePlaceholder":"What would you like to ask?","formConsent":"I agree to share these details with the clinic over WhatsApp to be contacted about my inquiry.","formNote":"This opens WhatsApp; your message is sent only after you confirm it there.","waHello":"Hello Dr. Emir Aksu team, I would like a dental consultation.","medicalNote":"Educational information only; diagnosis, eligibility and outcomes require an individual dental assessment.","detailCta":"Curious whether this fits your needs?","detailCtaCopy":"A consultation is the right place to ask about suitability, alternatives, potential risks and timing.","journeyTitle":"Clarity, care and communication.","journeyIntro":"Every plan begins with understanding your oral health and what matters most to you.","travelHeading":"An Istanbul visit, considered carefully.","travelCopy":"Discuss appointment planning and patient support with the clinic before arranging travel.","privacyLead":"How information shared through this website is handled.","privacy":[["Inquiry details","The contact form opens WhatsApp with information you choose to provide. The website does not store submitted inquiry details on its own server."],["Campaign parameters","The site may temporarily store ad referral parameters in your browser session so the team can understand the source of an inquiry."],["Cookies","A local preference is stored for the cookie notice. No analytics scripts are loaded unless separately configured."],["Medical information","Avoid sending sensitive medical records through the initial inquiry form. Contact the clinic to agree on an appropriate secure channel."]],"cookiesText":"This site uses essential browser storage and optional campaign attribution. You can choose essential-only.","footerDesc":"Personalized cosmetic and restorative dental-care conversations in Istanbul, Türkiye.","footerRights":"Information is not medical advice.","brandLead":"A vivid, modern identity built around human care, confidence and precision.","brandHeading":"Cobalt Arch","brandDescription":"An energetic cobalt signature and architectural spacing create a confident, contemporary visual system.","brandWordmark":"Signature system","brandTypography":"Typography","brandArabicSample":"ابتسامتك تبدأ بالثقة","brandInteraction":"Interaction style","brandMotion":"Quiet animation, accessible contrast and mobile-first conversion."},"ar":{"announcement":"رعاية شخصية لابتسامتك في إسطنبول","locationLine":"إسطنبول، تركيا","kicker":"الدكتور أمير أكسو · طب الأسنان","heroTop":"ابتسامة تعكس","heroAccent":"ثقتك","heroEnd":"بنفسك.","heroLead":"عناية مدروسة بالأسنان، وخيارات علاجية تُشرح بوضوح، وتجربة تتمحور حولك منذ التواصل الأول وحتى المتابعة.","heroTrust1":"عناية تراعي احتياجاتك","heroTrust2":"مساعدة للمرضى القادمين من الخارج","cardBig":"ابتسامة بثقة","cardSmall":"كل خطة تبدأ بالاستماع إليك.","seal":"عناية / مصممة / لك ✳","trustBar":["تجميل الأسنان","ترميم الأسنان","استشارات شخصية","تجربة تتمحور حول المريض"],"servicesHeading":"دقة في العمل، واهتمام بالتفاصيل.","servicesLead":"تعرّف على علاجات الأسنان التجميلية والترميمية، مع توصيات تُبنى على تقييم كل حالة على حدة.","featureAlt":"بيئة عناية أسنان حديثة","featureKicker":"العناية تتجاوز الإجراء","featureHeading":"أسئلتك تستحق إجابات واضحة.","featureLead":"تبدأ رحلة العلاج الجيدة بفهم الخيارات، لا بالتسرع في اتخاذ القرار.","features":["شرح خيارات العلاج والفروق بينها بطريقة مفهومة","المساعدة في تنسيق زيارة إسطنبول وفق الخطة العلاجية","مناقشة التعليمات قبل الإجراء والعناية اللاحقة"],"stepsHeading":"خطوات واضحة نحو ابتسامتك.","stepsLead":"من الاستفسار الأول حتى المتابعة، تعرف على مراحل رحلتك.","steps":[["تواصل معنا","شارك أهدافك والأسئلة التي تشغلك."],["افهم خياراتك","ناقش العلاجات الممكنة ومتطلبات التقييم."],["خطط لزيارتك","راجع خطتك العلاجية وترتيبات الزيارة المناسبة."],["ابدأ العناية","اتبع الخطة العلاجية وناقش تعليمات العناية والمتابعة."]],"editorialEyebrow":"تجربة أكثر إنسانية","editorialHeading":"ابتسامتك شخصية، وعلاجك يجب أن يكون كذلك.","editorialLead":"ابدأ بحوار حول احتياجاتك، ثم تُحدد التفاصيل والتكلفة والمدة بعد التقييم الطبي.","faqLead":"إجابات مبسطة تساعدك على اتخاذ قرار واعٍ.","faq":[["كيف أعرف العلاج المناسب لي؟","يحدد طبيب الأسنان الخيارات المناسبة بعد فحص الأسنان واللثة والإطباق ومناقشة أهدافك."],["كم زيارة أحتاج؟","يختلف عدد الزيارات حسب العلاج وحالة الفم؛ فقد تتطلب الزراعة مراحل منفصلة."],["هل يمكن تنسيق العلاج خلال زيارتي لإسطنبول؟","يمكنك التواصل مع الفريق لمناقشة المواعيد وملاءمة المدة المتاحة لحالتك."],["هل ستكون النتيجة طبيعية؟","يراعي التخطيط شكل الأسنان ووظيفتها، لكن تختلف النتائج بين الأشخاص ولا يمكن ضمان نتيجة بعينها."]],"contactHeading":"خلينا نحكي عن ابتسامتك.","contactLead":"شاركنا بعض التفاصيل وانتقل مباشرة للتواصل مع الفريق عبر واتساب.","formTitle":"خبرنا شو حابب تغيّر بابتسامتك","namePlaceholder":"اسمك الكامل","countryPlaceholder":"من أي دولة ستزورنا؟","messagePlaceholder":"شو بتحب تستفسر؟","formConsent":"أوافق على مشاركة هذه المعلومات مع العيادة عبر واتساب للتواصل بشأن استفساري.","formNote":"سيُفتح واتساب، ولن تُرسل الرسالة إلا بعد تأكيدك داخل التطبيق.","waHello":"مرحباً فريق د. أمير أكسو، أود الاستفسار عن استشارة أسنان.","medicalNote":"المحتوى للتعريف بالخدمات وليس تشخيصاً طبياً؛ تحدد الأهلية والنتائج بعد تقييم فردي.","detailCta":"هل يناسب هذا العلاج حالتك؟","detailCtaCopy":"الاستشارة فرصتك لمعرفة الملاءمة والبدائل والمخاطر المحتملة والمدة اللازمة.","journeyTitle":"وضوح واهتمام في كل خطوة.","journeyIntro":"كل رحلة تبدأ بفهم صحة الفم والأمور التي تهمك.","travelHeading":"زيارتك إلى إسطنبول تبدأ بالتخطيط.","travelCopy":"ناقش المواعيد وخيارات دعم المرضى قبل حجز سفرك.","privacyLead":"كيفية التعامل مع المعلومات التي تشاركها عبر هذا الموقع.","privacy":[["معلومات الاستفسار","يفتح النموذج واتساب بالمعلومات التي تختار مشاركتها. الموقع لا يحفظ بيانات طلبك على خادم خاص به."],["مصدر الحملات الإعلانية","قد يحتفظ المتصفح مؤقتاً ببيانات الإحالة لتحديد مصدر الاستفسار."],["ملفات الارتباط","يُخزن اختيارك لإشعار الخصوصية محلياً. لا تُحمّل أدوات التحليل إلا إذا ضُبطت لاحقاً."],["البيانات الطبية","تجنب إرسال السجلات الطبية الحساسة عبر نموذج الاستفسار الأولي؛ تواصل مع العيادة لتحديد قناة آمنة."]],"cookiesText":"يستخدم الموقع تخزيناً أساسياً في المتصفح ومعلومات إحالة اختيارية للحملات.","footerDesc":"رعاية أسنان تجميلية وترميمية تتمحور حول احتياجاتك في إسطنبول، تركيا.","footerRights":"المعلومات لا تغني عن الاستشارة الطبية.","brandLead":"هوية معاصرة وحيوية تجمع الثقة والدقة والاهتمام الإنساني.","brandHeading":"Cobalt Arch","brandDescription":"الأزرق الكوبالت والخطوط الواضحة يكوّنان نظاماً بصرياً قوياً ومعاصراً.","brandWordmark":"نظام الشعار","brandTypography":"الخطوط","brandArabicSample":"ابتسامتك تبدأ بالثقة","brandInteraction":"الحركة والتفاعل","brandMotion":"حركات هادئة وتباين مريح وتجربة مخصصة للهاتف."}}};</script><script src="/landing.js" defer></script></body></html>
